spring.config.import=optional:file:.env[.properties]

spring.application.name=phegonbank

server.port=${PORT}

#MySql Database connection
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}

#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#JWT Configuration
jwt.secret.string =${JWT_SECRET}
jwt.expiration.time =${JWT_EXPIRATION_TIME}

# Mail Configuration
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587

#Enable TLS SMTP MAIL
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


password.reset.link=http://localhost:3000/reset-password?code =  


#AWS S3 CONFIG
aws.accessKeyId =${AWS_ACCESS_KEY}
aws.secretAccessKey =${AWS_SECRET_KEY}
aws.region =eu-north-1
aws.s3.bucketName = ${AWS_BUCKET_NAME}



#This configuration file sets up a Spring Boot application named phegonbank.
#It dynamically assigns the server port, securely connects to a local MySQL
#database, manages Hibernate entity generation, and configures Custom JWT
#authentication via an external .env file.


#spring.config.import=optional:file:.env[.properties]: Tells Spring Boot to
# load environment variables from a local .env file. The optional: prefix
# prevents the application from crashing if the .env file is missing.

#spring.application.name=phegonbank: Sets the internal name of your application,
# which is helpful if you are registering it in a microservice registry like Eureka


#server.port=${PORT}: Sets the application?s web server port to be read
# dynamically from the PORT variable defined in your .env file.4

#jwt.secret.string=${JWT_SECRET}: Injects the secret encryption key used to sign
# and verify your JSON Web Tokens (JWT).