<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credit Alert</title>

    <style>
        Body { font-family: Arial, sans-serif; background: #f6f9fc; margin: 0; padding: 0;}
        .container { max-width: 600px; margin: 30px auto; background: #ffffff;
            border-radius: 8px; padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align:center;}
        h2 {color: #2e7d32;}
        .alert {background: #e8f5e9; padding: 15px; border-radius: 6px; margin: 15px 0;}
        .footer{margin-top: 20px; font-size: 13px; color: #555;text-align: center;}
    </style>
</head>
<body>
<div class="container">
    <h2>Credit Alert</h2>
    <p>Dear <span th:text="${name}">Customer</span>,</p>
    <div class="alert">
        <p>Your account has been credited with <b>$<span th:text="${amount}"></span></b></p>
        <p>Account Number: <b th:text="${accountNumber}"></b></p>
        <p>Date: <span th:text="${date}"></span></p>
        <p>Available Balance: <b>$<span th:text = "${balance}"></span></b></p>
        </div>
        <p>Thank you for banking with us.</p>
        <div class="footer">
            © 2026 Phegon Bank | Secure Online Banking

        </div>
    </div>
</div>
</body>
</html>
